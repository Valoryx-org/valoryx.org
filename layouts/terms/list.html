{{ define "main" }}
<section class="py-28 text-center">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-3xl sm:text-4xl font-extrabold mb-6" style="color: var(--heading); letter-spacing: -0.04em;">
      {{ .Title }}
    </h1>
    <div class="text-base leading-relaxed text-left" style="color: var(--body); line-height: 1.8;">
      {{ .Content }}
    </div>
  </div>
</section>
{{ end }}
